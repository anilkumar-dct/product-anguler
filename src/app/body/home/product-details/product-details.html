@if (showSelectProduct) {
<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()">×</button>
    <div class="modal-body">
      <div class="modal-left">
        <img
          [src]="showSelectProduct.thumbnail"
          alt="Product"
          class="modal-image"
        />
      </div>
      <div class="modal-right">
        <h2 class="modal-title">{{ showSelectProduct.title }}</h2>
        <p class="modal-description">{{ showSelectProduct.description }}</p>

        <div class="modal-rating">
          <span class="rating-stars">
            ★★★★★
            <span
              class="rating-fill"
              [style.width.%]="showSelectProduct.rating * 20"
            >
              ★★★★★
            </span>
          </span>
          <span class="rating-value">({{ showSelectProduct.rating }})</span>
        </div>

        <p class="modal-price">
          ${{ showSelectProduct.price }}
          <span class="modal-discount"
            >-{{ showSelectProduct.discountPercentage }}%</span
          >
        </p>

        <div class="quantity-control">
          <button (click)="decreaseQty()">−</button>
          <span>{{ quantity() }}</span>
          <button (click)="increaseQty()">+</button>
        </div>

        <div class="modal-actions">
          <button class="cancel-btn" (click)="closeModal()">Cancel</button>
          <button
            class="add-btn"
            (click)="addToCart(showSelectProduct, quantity)"
          >
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
}
